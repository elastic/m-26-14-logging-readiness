# =============================================================================
# Elastic Workflow: M-26-14 Data Retirement — Gate 2 Execution
# Category: compliance/data-management
#
# Manual workflow triggered after Gate 2 final deletion is authorized.
# This is the ONLY step in the two-gate flow that makes deletion possible:
# it switches the index from its no-delete ILM policy to the
# deletion-enabled variant, then ILM takes a compliance snapshot
# (wait_for_snapshot via SLM policy m_26_14-readiness-snapshots) before
# the delete action runs. Records the scheduled_for_deletion audit state.
#
# PREREQUISITES (verify BEFORE running):
#   1. An approved_gate2 record exists in m_26_14-retirement-requests for
#      this index (Gate 2 authorization documented).
#   2. No active legal hold covers this index — search
#      m_26_14-retirement-requests for state:legal_hold_initiated whose
#      source_index pattern matches. The check_legal_holds step surfaces
#      these in the execution log, but a human must confirm.
#
#
# Schema: github.com/elastic/workflows
# Author: Elastic / M-26-14 Readiness Pack
# Tags: M-26-14, Readiness, Data Retirement, Manual
# =============================================================================
version: "1"
name: M-26-14 Data Retirement — Gate 2 Execution
description: >
  Manual workflow: run after Gate 2 final deletion authorization is confirmed
  for a specific index. Switches the index from its no-delete ILM policy to
  the deletion-enabled variant — the only step that makes deletion possible.
  ILM wait_for_snapshot then enforces a durable compliance snapshot before
  the delete action executes. Records the scheduled_for_deletion audit state.
enabled: false
tags:
  - M-26-14
  - Readiness
  - Data Retirement
  - Manual

# ---------------------------------------------------------------------------
# CONSTANTS
# ---------------------------------------------------------------------------
consts:
  retirement_index: m_26_14-retirement-requests

# ---------------------------------------------------------------------------
# TRIGGERS — manual only
# ---------------------------------------------------------------------------
triggers:
  - type: manual
    inputs:
      - name: index_name
        type: string
        description: "Index with Gate 2 approval to execute deletion (e.g. .ds-logs-m_26_14.dns-default-2025.01)"
      - name: ilm_delete_policy
        type: string
        description: "Deletion-enabled ILM policy to apply (e.g. m_26_14-logs-l3-hot-frozen)"
        default: "m_26_14-logs-l3-hot-frozen"
      - name: gate2_approved_by
        type: string
        description: "Username of the Gate 2 approver"
      - name: gate1_approved_by
        type: string
        description: "Username of the Gate 1 approver (for complete audit record)"

# ---------------------------------------------------------------------------
# STEPS
# ---------------------------------------------------------------------------
steps:

  # -------------------------------------------------------------------------
  # STEP 1: check_legal_holds
  # -------------------------------------------------------------------------
  # Surfaces any active legal-hold records so the operator sees them in the
  # execution log before the policy switch. Review the output: if any
  # source_index pattern matches the target index, STOP and cancel.
  # -------------------------------------------------------------------------
  - name: check_legal_holds
    type: elasticsearch.search
    with:
      index: "{{ consts.retirement_index }}"
      query:
        terms:
          state: ["legal_hold_initiated", "legal_hold"]
      size: 50
    on-failure:
      continue: true

  # -------------------------------------------------------------------------
  # STEP 2: switch_to_delete_policy
  # -------------------------------------------------------------------------
  # Applies the deletion-enabled ILM policy. ILM then progresses naturally:
  # delete phase -> wait_for_snapshot (blocks until SLM snapshot) -> delete.
  # This replaces the previous fragile _ilm/move call: ILM itself validates
  # phase progression, and the snapshot gate cannot be skipped.
    # -------------------------------------------------------------------------
  - name: switch_to_delete_policy
    type: elasticsearch.request
    with:
      method: PUT
      path: /{{ inputs.index_name }}/_settings
      body:
        index.lifecycle.name: "{{ inputs.ilm_delete_policy }}"
    on-failure:
      continue: false
      retry:
        max-attempts: 2
        delay: 10s

  # -------------------------------------------------------------------------
  # STEP 3: record_scheduled_deletion
  # -------------------------------------------------------------------------
  - name: record_scheduled_deletion
    type: elasticsearch.index
    with:
      index: "{{ consts.retirement_index }}"
      id: "{{ inputs.index_name }}-scheduled-{{ execution.id }}"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        request_id: "{{ inputs.index_name }}-scheduled-{{ execution.id }}"
        index_name: "{{ inputs.index_name }}"
        state: scheduled_for_deletion
        updated_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        gate1_approved_by: "{{ inputs.gate1_approved_by }}"
        gate2_approved_by: "{{ inputs.gate2_approved_by }}"
        gate2_approved_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        delete_policy: "{{ inputs.ilm_delete_policy }}"
        delete_policy_applied: true
        watcher_id: m_26_14-data-retirement-gate2-execute
    on-failure:
      continue: true

  # -------------------------------------------------------------------------
  # STEP 4: log_completion
  # -------------------------------------------------------------------------
  - name: log_completion
    type: console
    with:
      message: "Gate 2 executed for {{ inputs.index_name }}. ILM switched to {{ inputs.ilm_delete_policy }} — compliance snapshot (wait_for_snapshot) precedes deletion. Gate1: {{ inputs.gate1_approved_by }}, Gate2: {{ inputs.gate2_approved_by }}"
