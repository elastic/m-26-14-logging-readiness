# =============================================================================
# Elastic Workflow: M-26-14 Data Retirement — Gate 1 Approval Handler
# Category: compliance/data-management
#
# Manual workflow triggered after a human approves Gate 1 for a specific
# index. Records approved_gate1 and pending_gate2 audit states, then opens
# a Gate 2 (final deletion authorization) Kibana Case.
#
# IMPORTANT: No ILM change happens at Gate 1. The index stays on its
# no-delete policy until Gate 2 approval — the Gate 2 Execution workflow
# performs the switch to the deletion-enabled variant. This guarantees
# both gates must pass before deletion becomes possible. ILM
# wait_for_snapshot then still blocks deletion until the SLM policy
# m_26_14-readiness-snapshots confirms a durable S3 backup exists.
#
#
# Schema: github.com/elastic/workflows
# Author: Elastic / M-26-14 Readiness Pack
# Tags: M-26-14, Readiness, Data Retirement, Manual
# =============================================================================
version: "1"
name: M-26-14 Data Retirement — Gate 1 Approval Handler
description: >
  Manual workflow: run after Gate 1 has been approved for a specific index.
  Records approved_gate1 and pending_gate2 states in the audit index and
  opens a Gate 2 (final deletion authorization) Kibana Case. No ILM change
  happens at Gate 1 — the index keeps its no-delete policy until the Gate 2
  Execution workflow switches it to the deletion-enabled variant, after
  which ILM wait_for_snapshot enforces a durable snapshot before deletion.
enabled: false
tags:
  - M-26-14
  - Readiness
  - Data Retirement
  - Manual

# ---------------------------------------------------------------------------
# CONSTANTS — update before enabling
# ---------------------------------------------------------------------------
consts:
  retirement_index: m_26_14-retirement-requests
  notification_connector_id: YOUR-SLACK-OR-EMAIL-CONNECTOR-ID

# ---------------------------------------------------------------------------
# TRIGGERS — manual only, run after Gate 1 approval documented in audit index
# ---------------------------------------------------------------------------
triggers:
  - type: manual
    inputs:
      - name: index_name
        type: string
        description: "Frozen index approved for retirement (e.g. .ds-logs-m_26_14.dns-default-2025.01)"
      - name: approved_by
        type: string
        description: "Username of the Gate 1 approver"
      - name: ilm_delete_policy
        type: string
        description: "Deletion-enabled ILM policy Gate 2 will apply (e.g. m_26_14-logs-l3-hot-frozen) — recorded for audit, NOT applied here"
        default: "m_26_14-logs-l3-hot-frozen"
      - name: original_ilm_policy
        type: string
        description: "Current (no-delete) ILM policy on the index"
        default: "m_26_14-logs-l3-no-delete"
      - name: phase_age_days
        type: string
        description: "Days the index has been in the frozen phase (for audit record)"
        default: "0"

# ---------------------------------------------------------------------------
# STEPS
# ---------------------------------------------------------------------------
steps:

  # -------------------------------------------------------------------------
  # STEP 1: record_approved_gate1
  # -------------------------------------------------------------------------
  # NOTE: deliberately NO ILM change in this workflow. The index keeps its
  # no-delete policy until Gate 2 Execution applies the delete-enabled
  # variant. Both gates must pass before deletion becomes possible.
  # -------------------------------------------------------------------------
  - name: record_approved_gate1
    type: elasticsearch.index
    with:
      index: "{{ consts.retirement_index }}"
      id: "{{ inputs.index_name }}-gate1-approved"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        request_id: "{{ inputs.index_name }}-gate1"
        index_name: "{{ inputs.index_name }}"
        state: approved_gate1
        updated_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        phase_age_days: "{{ inputs.phase_age_days }}"
        ilm_policy: "{{ inputs.original_ilm_policy }}"
        delete_policy: "{{ inputs.ilm_delete_policy }}"
        gate1_approved_by: "{{ inputs.approved_by }}"
        gate1_approved_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        delete_policy_applied: false
        watcher_id: m_26_14-data-retirement-gate1-approval
    on-failure:
      continue: true

  # -------------------------------------------------------------------------
  # STEP 2: record_pending_gate2
  # -------------------------------------------------------------------------
  - name: record_pending_gate2
    type: elasticsearch.index
    with:
      index: "{{ consts.retirement_index }}"
      id: "{{ inputs.index_name }}-gate2"
      document:
        "@timestamp": "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        request_id: "{{ inputs.index_name }}-gate2"
        index_name: "{{ inputs.index_name }}"
        state: pending_gate2
        created_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        updated_at: "{{ execution.startedAt | date: '%Y-%m-%dT%H:%M:%S.000Z' }}"
        phase_age_days: "{{ inputs.phase_age_days }}"
        ilm_policy: "{{ inputs.original_ilm_policy }}"
        delete_policy: "{{ inputs.ilm_delete_policy }}"
        ilm_phase: frozen
        gate1_approved_by: "{{ inputs.approved_by }}"
        delete_policy_applied: false
        watcher_id: m_26_14-data-retirement-gate1-approval
    on-failure:
      continue: true

  # -------------------------------------------------------------------------
  # STEP 3: open_gate2_case
  # -------------------------------------------------------------------------
  - name: open_gate2_case
    type: cases.createCase
    with:
      title: "M-26-14 Data Retirement — Gate 2 Authorization Required: {{ inputs.index_name }}"
      description: |
        ## M-26-14 Data Retirement: Gate 2 — Final Deletion Authorization

        | Field | Value |
        |-------|-------|
        | **Index** | `{{ inputs.index_name }}` |
        | **Gate 1 Approved By** | {{ inputs.approved_by }} |
        | **Gate 1 Approved At** | {{ execution.startedAt | date: '%Y-%m-%d %H:%M UTC' }} |
        | **Deletion ILM Policy** | `{{ inputs.ilm_delete_policy }}` |
        | **Original Policy** | `{{ inputs.original_ilm_policy }}` |

        ---
        ### Current State

        The index is **still on its no-delete ILM policy** — no data change
        has occurred. Deletion only becomes possible after Gate 2, when the
        Gate 2 Execution workflow switches the index to
        `{{ inputs.ilm_delete_policy }}`. ILM `wait_for_snapshot` then
        blocks deletion until the SLM policy `m_26_14-readiness-snapshots`
        confirms a durable S3 backup exists (runs daily, no manual action).

        ---
        ### Gate 2 Authorization Instructions

        1. Confirm no active legal hold covers this index
           (search `m_26_14-retirement-requests` for `state: legal_hold_initiated`
           whose `source_index` pattern matches).

        2. Authorize final deletion by indexing to `m_26_14-retirement-requests`:
           ```json
           {
             "@timestamp": "<now-iso>",
             "request_id": "{{ inputs.index_name }}-gate2-approved",
             "index_name": "{{ inputs.index_name }}",
             "state": "approved_gate2",
             "gate2_approved_by": "<your-username>",
             "gate2_approved_at": "<now-iso>"
           }
           ```

        3. Run the **M-26-14 Data Retirement — Gate 2 Execution** workflow
           with `index_name: {{ inputs.index_name }}` — it applies the
           deletion-enabled ILM policy and records the final audit state.

        ---
        *Auto-generated by M-26-14 Data Retirement Gate 1 Approval Handler workflow.*
      owner: securitySolution
      settings:
        syncAlerts: false
      severity: high
      tags:
        - m_26_14
        - data-retirement
        - gate2
        - compliance

  # -------------------------------------------------------------------------
  # STEP 4: notify_gate2_pending
  # -------------------------------------------------------------------------
  - name: notify_gate2_pending
    type: kibana.request
    with:
      method: POST
      path: /api/actions/connector/{{ consts.notification_connector_id }}/_execute
      body:
        params:
          message: |
            [M-26-14] Data Retirement Gate 2 — Authorization Required
            Index: {{ inputs.index_name }}
            Gate 1 approved by: {{ inputs.approved_by }}
            Index remains on no-delete policy ({{ inputs.original_ilm_policy }}) until Gate 2.

            Next steps:
            1. Confirm no active legal hold covers this index
            2. Index the approved_gate2 audit record
            3. Run the Gate 2 Execution workflow (applies {{ inputs.ilm_delete_policy }})
    on-failure:
      continue: true

  # -------------------------------------------------------------------------
  # STEP 5: log_completion
  # -------------------------------------------------------------------------
  - name: log_completion
    type: console
    with:
      message: "Gate 1 approved for {{ inputs.index_name }} (no ILM change — happens at Gate 2). Gate 2 case opened. Approved by: {{ inputs.approved_by }}"
