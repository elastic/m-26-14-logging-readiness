# Serve the built SPA and fall back to index.html for client-side routes.
# The app uses react-router's BrowserRouter, so a deep link like /compliance is a
# client route with no file on disk — try_files serves index.html and the router
# takes over (this is what vercel.json's rewrite did on the old host).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback: any unmatched path resolves to the app shell.
    # (No aggressive immutable caching: dist/assets/ mixes Vite's fingerprinted bundles
    # with the app's non-fingerprinted reference data under public/assets/.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
