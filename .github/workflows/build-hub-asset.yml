# Regenerates the Elastic Hub "HTML Page" library asset (single-file build of this
# viewer, see elastic/elastic-hub#123) on every push to main, and commits it to
# hub/ when its content actually changed. The committed file is what gets
# contributed to the Hub's Tools Library; its raw URL always reflects main:
# https://raw.githubusercontent.com/elastic/m-26-14-logging-readiness/main/hub/m-26-14-reference-architecture-viewer.md
#
# The build is deterministic (fixed createdAt, locked deps), so the diff check
# only fires on real content changes. The bot commit touches only hub/**, which
# this workflow ignores — no self-trigger loop.
name: build-hub-asset

on:
  push:
    branches: [main]
    paths-ignore:
      - 'hub/**'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:hub

      - name: Commit regenerated asset if changed
        run: |
          mkdir -p hub
          cp dist-hub/m-26-14-reference-architecture-viewer.md hub/
          if git diff --quiet -- hub/; then
            echo "Hub asset unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/
          git commit -m "chore: regenerate Elastic Hub asset for ${GITHUB_SHA::7}"
          git push
