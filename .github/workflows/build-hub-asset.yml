# Regenerates the single-file HTML page for the Elastic Hub's "HTML Page" asset
# type (see elastic/elastic-hub#123) on every push to main, and commits it to
# hub/ when its content actually changed. The Hub library asset is created
# manually from this file; its raw URL always reflects main:
# https://raw.githubusercontent.com/elastic/m-26-14-logging-readiness/main/hub/m-26-14-reference-architecture-viewer.html
#
# The build is deterministic (locked deps), so the diff check only fires on real
# content changes. The bot commit touches only hub/**, which this workflow
# ignores — no self-trigger loop.
name: build-hub-asset

on:
  push:
    branches: [main]
    paths-ignore:
      - 'hub/**'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:hub

      - name: Commit regenerated asset if changed
        run: |
          mkdir -p hub
          cp dist-hub/index.html hub/m-26-14-reference-architecture-viewer.html
          if git diff --quiet -- hub/; then
            echo "Hub asset unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/
          git commit -m "chore: regenerate Elastic Hub asset for ${GITHUB_SHA::7}"
          git push
